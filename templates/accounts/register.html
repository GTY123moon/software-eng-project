{% extends 'base.html' %}
{% load static %}

{% block title %}注册 · 智慧医疗在线问诊与处方流转平台{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">

<div class="login-wrap">
    <div class="login-card">
        <h1>注册患者账号</h1>
        <p class="sub">填写以下信息完成注册</p>

        {% if register_error %}
        <div class="form-error">{{ register_error }}</div>
        {% endif %}

        <form method="post" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>姓名</label>
                <input type="text" name="name" placeholder="请输入真实姓名"
                       value="{{ form.name|default:'' }}" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>手机号</label>
                    <input type="text" name="phone" placeholder="8 位登录手机号"
                           value="{{ form.phone|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" name="password" placeholder="设置密码" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>性别</label>
                    <select name="gender">
                        <option value="男">男</option>
                        <option value="女">女</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>年龄</label>
                    <input type="number" name="age" min="0" max="120" placeholder="如 28"
                           value="{{ form.age|default:'' }}">
                </div>
            </div>
            <div class="form-group">
                <label>身份证号</label>
                <input type="text" name="id_card" placeholder="18 位身份证号"
                       value="{{ form.id_card|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>过敏史（无则填“无”）</label>
                <input type="text" name="allergy" placeholder="如：青霉素过敏"
                       value="{{ form.allergy|default:'' }}">
            </div>
            <div class="form-group">
                <label>联系地址</label>
                <input type="text" name="address" placeholder="选填"
                       value="{{ form.address|default:'' }}">
            </div>
            <button class="btn-primary btn-block" type="submit">注 册</button>
        </form>
        <div class="login-foot">
            <a href="{% url 'accounts:login' %}">已有账号，返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
