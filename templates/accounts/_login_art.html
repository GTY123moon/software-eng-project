{# 登录页左侧医疗装饰：内联 SVG 等距场景 + 平台特性胶囊，纯 SVG/CSS 无外部图片，患者/职工登录页复用 #}
<div class="login-art" aria-hidden="true">
    <svg viewBox="0 0 460 340" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient id="artShield" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#5cc8ff" stop-opacity="0.95"/>
                <stop offset="1" stop-color="#2f9fd8" stop-opacity="0.55"/>
            </linearGradient>
            <linearGradient id="artBar" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0" stop-color="#2fb6c9" stop-opacity="0.85"/>
                <stop offset="1" stop-color="#7fe3d0" stop-opacity="0.95"/>
            </linearGradient>
            <linearGradient id="artCard" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
            </linearGradient>
        </defs>

        <!-- 地面光晕 -->
        <ellipse cx="230" cy="292" rx="170" ry="22" fill="#0b2f55" opacity="0.45"/>

        <!-- 左侧：防护盾牌 + 医疗十字 -->
        <g>
            <path d="M96 70 L138 86 L138 138 C138 172 118 196 96 208 C74 196 54 172 54 138 L54 86 Z"
                  fill="url(#artShield)" stroke="#8fd8ff" stroke-width="2"/>
            <path d="M96 100 h14 v14 h14 v14 h-14 v14 h-14 v-14 h-14 v-14 h14 Z" fill="#ffffff" opacity="0.95"/>
        </g>

        <!-- 中间上方：心电卡片 -->
        <g>
            <rect x="176" y="62" width="128" height="76" rx="12" fill="url(#artCard)" stroke="#9ad6ff" stroke-opacity="0.5"/>
            <polyline points="190,104 210,104 220,86 234,118 246,96 256,104 290,104"
                       stroke="#7fe3d0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- 中间下方：数据柱（等距阶梯） -->
        <g>
            <rect x="176" y="216" width="30" height="52" rx="5" fill="url(#artBar)"/>
            <rect x="218" y="192" width="30" height="76" rx="5" fill="url(#artBar)"/>
            <rect x="260" y="168" width="30" height="100" rx="5" fill="url(#artBar)"/>
        </g>

        <!-- 右侧：平板/处方单 -->
        <g>
            <rect x="330" y="112" width="86" height="120" rx="12" fill="url(#artCard)" stroke="#9ad6ff" stroke-opacity="0.5"/>
            <rect x="344" y="132" width="58" height="8" rx="4" fill="#ffffff" opacity="0.5"/>
            <rect x="344" y="150" width="40" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
            <rect x="344" y="176" width="58" height="30" rx="6" fill="#2fb6c9" opacity="0.55"/>
            <path d="M356 191 l8 8 l14 -16" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- 漂浮点缀：圆点 + 十字星 -->
        <g fill="#8fd8ff">
            <circle cx="150" cy="52" r="4" opacity="0.8"/>
            <circle cx="330" cy="66" r="5" opacity="0.6"/>
            <circle cx="398" cy="238" r="4" opacity="0.7"/>
            <circle cx="44" cy="230" r="3" opacity="0.6"/>
        </g>
        <g stroke="#7fe3d0" stroke-width="2" stroke-linecap="round" opacity="0.8">
            <path d="M360 60 v14 M353 67 h14"/>
            <path d="M140 250 v12 M134 256 h12"/>
        </g>
        <!-- 连接线 -->
        <g stroke="#5cc8ff" stroke-opacity="0.35" stroke-dasharray="4 6">
            <path d="M138 120 C 170 120 170 100 176 100"/>
            <path d="M306 190 C 322 190 322 170 330 170"/>
        </g>
    </svg>
</div>

<ul class="login-features">
    <li>在线问诊</li>
    <li>电子处方</li>
    <li>药师审核</li>
    <li>处方流转</li>
</ul>
