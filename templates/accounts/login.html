{% extends 'base.html' %}
{% load static %}

{% block title %}登录 · 智慧医疗在线问诊与处方流转平台{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">

<div class="login-wrap">
    <div class="login-card login-card-narrow">
        <h1>智慧医疗在线问诊与处方流转平台</h1>
        <p class="sub">患者端登录</p>

        {% if error %}
        <div class="form-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>账号 / 手机号</label>
                <input type="text" name="phone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button class="btn-primary btn-block" type="submit">登 录</button>
        </form>
        <div class="login-foot">
            <a href="{% url 'accounts:register' %}">注册患者账号</a>
        </div>
        <p class="login-tip">演示账号：13800000002　密码：demo123456</p>
    </div>
</div>
{% endblock %}
