{% extends 'base.html' %}
{% load static %}

{% block title %}选择身份 · 智慧医疗在线问诊与处方流转平台{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">

<div class="login-wrap">
    <div class="role-panel">
        <h1>智慧医疗在线问诊与处方流转平台</h1>
        <p class="sub">请选择登录身份</p>

        <div class="role-grid">
            <a class="role-card" href="{% url 'accounts:login' %}">
                <div class="entry-icon">患</div>
                <div class="entry-body">
                    <div class="entry-title">患者</div>
                    <div class="entry-desc">注册 / 手机号登录，发起问诊、查看处方</div>
                </div>
            </a>

            <a class="role-card" href="{% url 'accounts:staff_login' 'doctor' %}">
                <div class="entry-icon">医</div>
                <div class="entry-body">
                    <div class="entry-title">医生</div>
                    <div class="entry-desc">职工内部密钥登录，接诊与开具处方</div>
                </div>
            </a>

            <a class="role-card" href="{% url 'accounts:staff_login' 'pharmacist' %}">
                <div class="entry-icon">药</div>
                <div class="entry-body">
                    <div class="entry-title">药师</div>
                    <div class="entry-desc">职工内部密钥登录，审核处方与配药发药</div>
                </div>
            </a>

            <a class="role-card" href="{% url 'accounts:staff_login' 'admin' %}">
                <div class="entry-icon">管</div>
                <div class="entry-body">
                    <div class="entry-title">管理员</div>
                    <div class="entry-desc">内部密钥登录，账号、目录、排班与日志审计</div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
