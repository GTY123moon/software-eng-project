{% extends 'base.html' %}
{% load static %}

{% block title %}选择身份 · 智慧医疗在线问诊与处方流转平台{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">

<div class="login-wrap">
    <div class="role-panel">
        <h1>智慧医疗在线问诊与处方流转平台</h1>
        <p class="sub">请选择登录身份</p>

        <div class="role-grid">
            <a class="role-card" href="{% url 'accounts:login' %}">
                <div class="entry-icon">患</div>
                <div class="entry-body">
                    <div class="entry-title">患者</div>
                    <div class="entry-desc">注册 / 手机号登录，发起线上问诊、查看处方</div>
                </div>
            </a>

            <a class="role-card" href="{% url 'accounts:staff_entry' %}">
                <div class="entry-icon">职</div>
                <div class="entry-body">
                    <div class="entry-title">职工</div>
                    <div class="entry-desc">医生 / 药师 / 管理员，内部密钥登录后台工作台</div>
                </div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
