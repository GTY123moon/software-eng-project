{% extends 'base.html' %}
{% load static %}

{% block title %}{{ role_cn }}登录 · 智慧医疗在线问诊与处方流转平台{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/accounts.css' %}">

<div class="login-wrap">
    <div class="login-card login-card-narrow">
        <h1>智慧医疗在线问诊与处方流转平台</h1>
        <p class="sub">{{ role_cn }}端 · 职工内部登录</p>

        {% if error %}
        <div class="form-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{% url 'accounts:staff_login' role %}">
            {% csrf_token %}
            <div class="form-group">
                <label>工作手机号（工作账号）</label>
                <input type="text" name="phone" placeholder="请输入登记的工作手机号"
                       value="{{ form.phone|default:'' }}" required>
            </div>
            <div class="form-group">
                <label>内部密钥</label>
                <input type="password" name="secret" placeholder="请输入后台分配的内部密钥" required>
            </div>
            <button class="btn-primary btn-block" type="submit">登 录</button>
        </form>
        <div class="login-foot">
            <a href="{% url 'accounts:role_select' %}">返回身份选择</a>
        </div>
        <p class="login-tip">演示内部密钥：demo123456（账号由后台统一开通，不可自助注册）</p>
    </div>
</div>
{% endblock %}
