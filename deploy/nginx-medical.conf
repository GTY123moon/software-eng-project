# ===== Nginx 反向代理样例 =====
# 安装步骤：复制为 /etc/nginx/sites-available/medical-platform，改 server_name 后
#   sudo ln -s /etc/nginx/sites-available/medical-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 静态/媒体文件由 Nginx 直接托管，动态请求反代给本机 Gunicorn(8000)。

server {
    listen 80;
    server_name 你的服务器公网IP或域名;

    # 聊天图片上传大小上限（按需要调整）
    client_max_body_size 20m;

    # 收集后的静态文件（python manage.py collectstatic 生成）
    location /static/ {
        alias /opt/medical-platform/staticfiles/;
        expires 7d;
    }

    # 用户上传的媒体文件（聊天图片）
    location /media/ {
        alias /opt/medical-platform/media/;
        expires 7d;
    }

    # 动态请求反代到 Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
